<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Deep Learning Notebooks and Datasets</title>
<desc id="desc">A visual learning laboratory covering neural network foundations, optimization, training dynamics, regularization, computer vision, transfer learning, and applied neural networks.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#0f172a"/>
    <stop offset="0.55" stop-color="#172554"/>
    <stop offset="1" stop-color="#0f766e"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.22"/>
  </filter>
</defs>
<rect width="1400" height="420" rx="28" fill="url(#bg)"/>
<circle cx="1190" cy="90" r="160" fill="#ffffff" opacity=".05"/>
<circle cx="1290" cy="310" r="220" fill="#ffffff" opacity=".04"/>
<g stroke="#ffffff" stroke-opacity=".12" fill="none">
  <path d="M930 80 L1080 145 L1210 95 L1330 180"/>
  <path d="M930 80 L1010 245 L1210 95"/>
  <path d="M1010 245 L1150 320 L1330 180"/>
  <path d="M1080 145 L1150 320"/>
</g>
<g fill="#ffffff">
  <circle cx="930" cy="80" r="9"/><circle cx="1080" cy="145" r="9"/><circle cx="1210" cy="95" r="9"/>
  <circle cx="1330" cy="180" r="9"/><circle cx="1010" cy="245" r="9"/><circle cx="1150" cy="320" r="9"/>
</g>
<g filter="url(#shadow)">
  <rect x="72" y="62" width="760" height="296" rx="24" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
</g>
<text x="116" y="128" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Deep Learning</text>
<text x="116" y="185" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Notebooks &amp; Datasets</text>
<text x="116" y="228" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="19">Learn the mechanism. Run the experiment. Visualize the behavior.</text>
<text x="116" y="258" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="19">Then turn the understanding into working models.</text>
<g transform="translate(116 292)">
  <rect width="126" height="38" rx="19" fill="#ffffff" fill-opacity=".12"/>
  <text x="63" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="700">31 NOTEBOOKS</text>
  <rect x="140" width="112" height="38" rx="19" fill="#ffffff" fill-opacity=".12"/>
  <text x="196" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="700">8 DATASETS</text>
  <rect x="266" width="160" height="38" rx="19" fill="#ffffff" fill-opacity=".12"/>
  <text x="346" y="25" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="700">7 LEARNING STAGES</text>
</g>
</svg>